<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Inquiry cycle">
  <rect width="1200" height="600" fill="#f8fafc"/>
  <circle cx="600" cy="300" r="180" fill="none" stroke="#1d4ed8" stroke-width="10"/>
  <text x="600" y="180" text-anchor="middle" font-size="26" font-family="Arial" fill="#1e3a8a">Question</text>
  <text x="800" y="310" text-anchor="middle" font-size="26" font-family="Arial" fill="#1e3a8a">Measure</text>
  <text x="600" y="450" text-anchor="middle" font-size="26" font-family="Arial" fill="#1e3a8a">Claim + evidence</text>
  <text x="400" y="310" text-anchor="middle" font-size="26" font-family="Arial" fill="#1e3a8a">Revise</text>
</svg>
