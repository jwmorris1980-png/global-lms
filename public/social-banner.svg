  <text x="464" y="258" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800">Already-loaded standards-aligned K-12 curriculum</text>
  <text x="464" y="324" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Pick a country, grade, subject, and build type. Move it into any LMS.</text>
  <text x="464" y="382" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">global-lms.org</text>
