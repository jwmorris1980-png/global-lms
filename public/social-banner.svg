<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Global LMS Social Banner</title>
  <desc id="desc">A blue education banner for Global LMS.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1500" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#071a3a"/>
      <stop offset="0.48" stop-color="#0b2b63"/>
      <stop offset="1" stop-color="#123d7a"/>
    </linearGradient>
    <radialGradient id="light" cx="0" cy="0" r="1" gradientTransform="translate(1120 120) rotate(135) scale(520 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1500" height="500" fill="url(#blue)"/>
  <rect width="1500" height="500" fill="url(#light)"/>
  <circle cx="186" cy="180" r="78" fill="none" stroke="#bfdbfe" stroke-width="16"/>
